# Backup only. If RoomScanner.xcodeproj ever fails to open, run:
#   brew install xcodegen && xcodegen
# in this folder to rebuild the Xcode project from this file.
name: RoomScanner
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  RoomScanner:
    type: application
    platform: iOS
    sources: [RoomScanner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vonmann.roomscanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Room Scanner
        INFOPLIST_KEY_NSCameraUsageDescription: Room Scanner uses the camera and LiDAR to measure your room.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
